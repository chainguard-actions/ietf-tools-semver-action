name: Test missing fromTag fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          fromTag: 'v999.999.999-does-not-exist'
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          NEXT: ${{ steps.action.outputs.next }}
        run: |
          echo "outcome: $OUTCOME next: $NEXT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for a non-existent fromTag"
            exit 1
          fi
          if [ -n "$NEXT" ]; then
            echo "FAIL: next should not be set"
            exit 1
          fi
          echo "PASS"
