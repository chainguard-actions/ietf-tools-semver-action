name: Test majorList bump
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          majorList: 'breaking, major'
          additionalCommits: |
            breaking: rewrite the public API
      - name: Assert major bump (or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CURRENT: ${{ steps.action.outputs.current }}
          BUMP: ${{ steps.action.outputs.bump }}
          NEXT: ${{ steps.action.outputs.next }}
          NEXT_MAJOR: ${{ steps.action.outputs.nextMajor }}
          NEXT_MAJOR_STRICT: ${{ steps.action.outputs.nextMajorStrict }}
        run: |
          echo "outcome: $OUTCOME current: $CURRENT bump: $BUMP next: $NEXT nextMajor: $NEXT_MAJOR"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$BUMP" != "major" ]; then echo "FAIL: expected bump=major"; exit 1; fi
            if ! echo "$NEXT" | grep -qE '^v[0-9]+\.0\.0$'; then
              echo "FAIL: major bump should yield vX.0.0"; exit 1
            fi
            if [ "$NEXT_MAJOR" != "v$NEXT_MAJOR_STRICT" ]; then
              echo "FAIL: nextMajor inconsistent"; exit 1
            fi
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
